get:
  tags:
    - Relatórios
  summary: Returns a report object
  operationId: GETReportsByID
  parameters:
    - $ref: '../components/id-fields-parameters.yaml#/components/parameters/idReport'
    - in: query
      name: include
      schema:
        type: string
        enum: [expenses,expenses.apportionment,expenses.expense_type,expenses.gps]
        default: expenses
      description: "Flag used to return related objects,if you want to return multiple relations, you must separate them using comma. e.g.: 'expenses,user'"
  security:
    - Authorization: []
  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  request:
                    type: string
                    example: https://api.vexpenses.com/v2/reports/{id}
                  method:
                    type: string
                    example: GET
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Reports successfully sent!
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '../components/reports-schemas.yaml#/components/schemas/Report'
                      - type: object
                        properties:
                          expense:
                            type: object
                            properties:
                              data:
                                type: array
                                items:
                                  allOf:
                                  - $ref: '../components/expenses-schemas.yaml#/components/schemas/Expense'
                                  - type: object
                                    properties:
                                      apportionment:
                                        type: object
                                        properties:
                                          data:
                                            type: array
                                            items:
                                              $ref: '../components/apportionment-schemas.yaml#/components/schemas/Apportionment'
    '401':
      description: "Error: Unauthorized"