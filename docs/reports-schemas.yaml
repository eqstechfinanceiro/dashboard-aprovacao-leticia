components:
  schemas:
    Report:
      type: object
      properties:
        id:
          type: number
          example: 9999
        external_id:
          type: string
          example: a3b52842-2a5a-45cf-a544-9cbee4c8f0e7
        user_id:
          type: number
          example: 999
        device_id:
          type: integer
          example: 999
        description:
          type: string
          example: description
        status:
          type: string
          example: ABERTO
        approval_stage_id:
          type: integer
          example: 999
        approval_user_id:
          type: integer
          example: 999
        approval_date:
          type: string
          format: date-time
          example: "2016-02-25 05:04:10"
        paying_company_id:
          type: integer
          example: 999
        payment_date:
          type: string
          format: date-time
          example: "2016-02-25 05:04:10"
        payment_method_id:
          type: integer
          example: 123123
        observation:
          type: string
          example: observation
        on:
          type: boolean
          example: true
        justification:
          type: string
          example: Justification
        pdf_link:
          type: string
          example: https://api.vexpenses.com/v1/relatorios/pdf/aSfdcaSasDaEWsx
        excel_link:
          type: string
          example: https://api.vexpenses.com/v1/relatorios/excel/aSfdcaSasDaEWsx
        created_at:
          type: string
          format: date-time
          example: "2019-01-01 01:10:00"
        updated_at:
          type: string
          format: date-time
          example: "2019-01-01 01:10:00"