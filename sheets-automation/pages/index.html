<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador VExpenses - Validação API com Indicadores</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Visualizador VExpenses - Validação API com Indicadores</h1>
            <p>Visualizador de planilhas com validação detalhada via API VExpenses</p>
        </div>
        
        <!-- Seletor de arquivos -->
        <div class="file-selector" id="file-selector"></div>
        
        <div class="file-info" id="file-info">
            <h3>📄 Carregando...</h3>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <span class="legend-color color-valid"></span>
                <span>Dados idênticos à API (✅)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color color-invalid"></span>
                <span>Dados diferentes da API (❌)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #e2e3e5; border: 1px solid #d6d8db;"></span>
                <span>Fórmula do Excel (fx)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color"></span>
                <span>Outros campos (sem validação API)</span>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="search-input" placeholder="🔍 Buscar na planilha...">
        </div>
        
        <div class="tabs" id="tabs"></div>
        <div class="table-container" id="table-container"></div>
    </div>
    
    <script src="../scripts/main.js"></script>
</body>
</html>
